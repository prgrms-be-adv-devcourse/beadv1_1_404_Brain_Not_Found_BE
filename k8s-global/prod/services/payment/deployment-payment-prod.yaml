apiVersion: apps/v1
kind: Deployment
#이 파일 정의
metadata:
  name: payment-dpy-prod
#동작 정의
spec:
  replicas: 1
#  제어할 라벨
  selector:
    matchLabels:
      app: payment-prod
#      pod 정의
  template:
    metadata:
      labels:
        app: payment-prod
#        컨테이너 정의
    spec:
      containers:
        - name: payment-pod-prod
          image: yuio7279/payment
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: payment-config-prod
            - secretRef:
                name: payment-secret-prod
            - secretRef:
                name: payment-secret-key-prod
      restartPolicy: Always
