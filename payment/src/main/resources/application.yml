server:
  port: 8087
spring:
  application:
    name: payment
  profiles:
    active: local

management:
  server:
    port: 8881
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus   # 노출할 엔드포인트
        exclude: beans, env, mappings                # 노출하지 않을 엔드포인트
      base-path: /actuator                            # 엔드포인트 기본 경로
  endpoint:
    prometheus:
      access: read_only
    health:
      show-details: always                           # 헬스체크 상세 정보
    info:
      access: read_only
  tracing:
    sampling:
      probability: 1.0
    propagation:
      consume: b3
      produce: b3_multi
  metrics:
    tags:
      application: ${spring.application.name}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

custom:
  batch:
    chunk:
      size: 100
    skip:
      limit: 10

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}